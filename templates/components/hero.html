{% load static %}
<!-- Hero Section -->
<section id="hero" class="hero section">

  <div class="container" data-aos="fade-up" data-aos-delay="100">

    <div class="row align-items-center content">
      <div class="col-lg-6" data-aos="fade-up" data-aos-delay="200">
        <h2>{{hero.title}}</h2>
        <p class="lead">{{hero.subtitle}}</p>
        <div class="cta-buttons" data-aos="fade-up" data-aos-delay="300">
          <a href="#portfolio" class="btn btn-primary">View Projects</a>
          <a href="#contact" class="btn btn-outline">Discuss Your Requirements</a>
        </div>
        <div class="hero-stats" data-aos="fade-up" data-aos-delay="400">
          <div class="stat-item">
            <span class="stat-number">{{hero.years_of_experience}}+</span>
            <span class="stat-label">Years Experience</span>
          </div>
          <div class="stat-item">
            <span class="stat-number">{{projects.count}}+</span>
            <span class="stat-label">Projects</span>
          </div>
          <div class="stat-item">
            <span class="stat-number">{{hero.happy_clients}}+</span>
            <span class="stat-label">Clients</span>
          </div>
        </div>
      </div>
      <div class="col-lg-6">
        <div class="hero-image">
          {% if hero and hero.image %}
            <img src="{{ hero.image.url }}" alt="Portfolio Hero Image" class="img-fluid" data-aos="zoom-out" data-aos-delay="30">
          {% endif %}
          <div class="shape-1"></div>
          <div class="shape-2"></div>
        </div>
      </div>
    </div>

  </div>

</section><!-- /Hero Section -->
