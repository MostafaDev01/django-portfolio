{% extends 'base.html' %}
{% load static %}

{% block title %}Server Error (500) - Portfolio{% endblock %}

{% block content %}
<section class="section py-5 my-5 text-center">
  <div class="container" data-aos="fade-up">
    <div class="row justify-content-center">
      <div class="col-lg-6">
        <h1 class="display-1 fw-bold text-danger mb-3">500</h1>
        <h2 class="h4 mb-3">Internal Server Error</h2>
        <p class="text-muted mb-4">
          Something unexpected happened on our end. Please try again later.
        </p>
        <a href="{% url 'home' %}" class="btn btn-primary px-4 py-2">
          <i class="bi bi-house-door me-2"></i>Return Home
        </a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
