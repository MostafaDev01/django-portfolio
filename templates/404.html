{% extends 'base.html' %}
{% load static %}

{% block title %}Page Not Found (404) - Portfolio{% endblock %}

{% block content %}
<section class="section py-5 my-5 text-center">
  <div class="container" data-aos="fade-up">
    <div class="row justify-content-center">
      <div class="col-lg-6">
        <h1 class="display-1 fw-bold text-primary mb-3">404</h1>
        <h2 class="h4 mb-3">Page Not Found</h2>
        <p class="text-muted mb-4">
          The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
        </p>
        <a href="{% url 'home' %}" class="btn btn-primary px-4 py-2">
          <i class="bi bi-house-door me-2"></i>Return Home
        </a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
